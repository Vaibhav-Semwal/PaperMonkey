services:

  qwen:
    image: ollama/ollama
    container_name: qwen-ollama
    ports:
      - "11434:11434"
    volumes:
      - D:/docker-data/ollama:/root/.ollama  
  
  backend:
    build: ./backend
    container_name: backend
    command: >
      sh -c "python manage.py migrate &&
             (python manage.py runserver 0.0.0.0:8001 &) &&
             exec uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"   # FastAPI
      - "8001:8001"   # Django admin
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings
      - PYTHONPATH=/app
      - DJANGO_SECRET_KEY=dev-secret-key-change-me
      - DJANGO_DEBUG=True
      - FIREBASE_SERVICE_ACCOUNT_JSON=/app/serviceAccountKey.json
      - QWEN_API_BASE_URL=http://qwen:11434/v1
      - QWEN_MODEL_NAME=qwen2.5:0.5b
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2:-false}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY:-}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT:-paper-generation}
    depends_on:
      - qwen

  frontend:
    build: ./frontend
    container_name: react-frontend
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  ollama_data: